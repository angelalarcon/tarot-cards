      const STEP_FADE_MS = 300;
      let uiStep = null;
      let stepTransitionBusy = false;

      function resetSectionOpacity(el) {
        if (!el) return;
        el.classList.remove("opacity-0");
        el.classList.add("opacity-100");
      }

      function syncStepBackdropForStep(stepNumber) {
        const tarotBackdrop = document.getElementById("tarotBackdrop");
        if (tarotBackdrop) {
          tarotBackdrop.classList.toggle("hidden", stepNumber === 3);
        }
      }

      function applyStepCommit(stepNumber) {
        [step1, step2, step3].forEach(resetSectionOpacity);
        step1.classList.toggle("hidden", stepNumber !== 1);
        step2.classList.toggle("hidden", stepNumber !== 2);
        step3.classList.toggle("hidden", stepNumber !== 3);
        syncStepBackdropForStep(stepNumber);
      }

      function setStep(stepNumber, options = {}) {
        const instant = Boolean(options && options.instant);
        const target = stepNumber;

        if (instant) {
          stepTransitionBusy = false;
          applyStepCommit(target);
          uiStep = target;
          return Promise.resolve();
        }

        if (stepTransitionBusy) {
          return Promise.resolve();
        }

        if (uiStep === null) {
          applyStepCommit(target);
          uiStep = target;
          return Promise.resolve();
        }

        if (uiStep === target) {
          return Promise.resolve();
        }

        stepTransitionBusy = true;
        const prev = uiStep;
        const outgoing = prev === 1 ? step1 : prev === 2 ? step2 : step3;

        return new Promise((resolve) => {
          outgoing.classList.remove("opacity-100");
          outgoing.classList.add("opacity-0");

          window.setTimeout(() => {
            resetSectionOpacity(outgoing);
            applyStepCommit(target);
            const incoming = target === 1 ? step1 : target === 2 ? step2 : step3;
            incoming.classList.remove("opacity-100");
            incoming.classList.add("opacity-0");
            void incoming.offsetWidth;
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                incoming.classList.remove("opacity-0");
                incoming.classList.add("opacity-100");
                uiStep = target;
                stepTransitionBusy = false;
                window.setTimeout(resolve, STEP_FADE_MS);
              });
            });
          }, STEP_FADE_MS);
        });
      }

      function updateRemainingText() {
        drawCountInput.max = String(Math.max(1, remainingDeck.length));
      }

      function placeDeckModeToggle(mode) {
        const wrap = document.getElementById("deckModeToggleWrap");
        const slotRandom = document.getElementById("deckModeToggleSlotRandom");
        const slotManual = document.getElementById("deckModeToggleSlotManual");
        if (!wrap || !slotRandom || !slotManual) return;
        (mode === "random" ? slotRandom : slotManual).appendChild(wrap);
      }

      function readCount() {
        const value = Number(drawCountInput.value);
        if (!Number.isInteger(value) || value < 1) return null;
        if (value > remainingDeck.length) return null;
        return value;
      }

      function viewportIsMdUp() {
        return typeof window.matchMedia === "function" && window.matchMedia("(min-width: 768px)").matches;
      }

      function viewportIsDesktopLarge() {
        return typeof window.matchMedia === "function" && window.matchMedia("(min-width: 1280px)").matches;
      }

      /** Reparto / flip: tiempos compartidos para sensación fluida (paso 3). */
      const CARD_ANIM = {
        staggerMs: 115,
        dealMs: 520,
        dealEase: "cubic-bezier(0.2, 0.82, 0.28, 1)",
        opacityMs: 320,
        opacityEase: "cubic-bezier(0.33, 0, 0.2, 1)",
        flipDelayMs: 320,
        flipMs: 450,
        flipEase: "cubic-bezier(0.34, 1.02, 0.52, 1)",
        dealTiltDeg: -5.5,
        /** Escala al “salir” del mazo (1 al aterrizar en la mesa) */
        deckFromScale: 0.88,
      };

      /** Punto en pantalla desde el que parece salir la carta (coincide con el mazo visual). */
      function deckDealAnchorScreen() {
        const d = deckPile.getBoundingClientRect();
        if (d.width < 4 || d.height < 4) {
          return { x: d.left + d.width * 0.5, y: d.top + d.height * 0.5 };
        }
        if (viewportIsMdUp()) {
          return { x: d.left + d.width * 0.5, y: d.top + d.height * 0.4 };
        }
        return { x: d.left + d.width * 0.62, y: d.top + d.height * 0.76 };
      }

      function tableCardLayout() {
        const cardSize = viewportIsDesktopLarge()
          ? {
              tileW: 280,
              overlapPx: 116,
              rowMarginTop: -40,
            }
          : {
              tileW: 140,
              overlapPx: 58,
              rowMarginTop: -20,
            };
        if (viewportIsMdUp()) {
          return {
            ...cardSize,
            stripWidthSlack: 208,
            stripMinFallback: 260,
            stripAvailBuffer: 48,
          };
        }
        return {
          ...cardSize,
          stripWidthSlack: 56,
          stripMinFallback: 260,
          stripAvailBuffer: 36,
        };
      }

      function deckPileLayout() {
        if (viewportIsMdUp()) {
          return { tileW: 140, deckLayerStep: 2 };
        }
        return { tileW: 114, deckLayerStep: 1 };
      }

      const MOBILE_DECK_FAN_W = 390;

      function renderDeckPile() {
        deckPile.innerHTML = "";
        const L = deckPileLayout();
        const layers = Math.max(1, Math.min(7, remainingDeck.length));
        const mdUp = viewportIsMdUp();

        for (let i = 0; i < layers; i += 1) {
          const back = document.createElement("div");
          back.className =
            "absolute box-border aspect-[350/600] overflow-hidden border-2 border-black bg-nomad-paper shadow-[0_1px_0_0_rgba(0,0,0,0.8)]";
          back.style.width = `${L.tileW}px`;

          if (mdUp) {
            const s = L.deckLayerStep;
            back.style.left = `${i * s}px`;
            back.style.top = `${i * -s}px`;
            back.style.bottom = "";
            back.style.marginLeft = "";
            back.style.transform = "";
            back.style.transformOrigin = "";
            back.style.zIndex = "";
          } else {
            back.style.top = "";
            const pivotX = (deckPile.offsetWidth || MOBILE_DECK_FAN_W) * 0.62;
            back.style.left = `${pivotX}px`;
            back.style.bottom = "10px";
            back.style.marginLeft = `-${L.tileW / 2}px`;
            back.style.transformOrigin = "bottom center";
            const n = layers;
            const spreadDeg = Math.min(44, 10 + (n - 1) * 6);
            const step = n <= 1 ? 0 : spreadDeg / (n - 1);
            const angleDeg = n <= 1 ? 0 : -spreadDeg / 2 + i * step;
            back.style.transform = `rotate(${angleDeg}deg)`;
            back.style.zIndex = String(10 + i);
          }

          back.innerHTML = `<img src="${TAROT_CARD_BACK_SRC}" alt="" class="block h-full w-full object-cover object-center" decoding="async" />`;
          deckPile.appendChild(back);
        }

        window.requestAnimationFrame(() => {
          if (viewportIsMdUp()) return;
          const backs = deckPile.querySelectorAll(":scope > div");
          const pivotX = (deckPile.offsetWidth || MOBILE_DECK_FAN_W) * 0.62;
          backs.forEach((back) => {
            back.style.left = `${pivotX}px`;
          });
        });

        const clickable = remainingDeck.length > 0 && !animating;
        deckPile.classList.toggle("cursor-pointer", clickable);
        deckPile.classList.toggle("transition-transform", clickable);
        deckPile.classList.toggle("duration-200", clickable);
        deckPile.classList.toggle("hover:-translate-y-0.5", clickable);
      }

      function setManualHelper() {
        const n = manualSelected.size;
        manualHelper.textContent =
          n < 1
            ? "Elige tus cartas"
            : `Listas para la tirada: ${n} carta(s). Pulsa cuando quieras pasar a la mesa.`;
        toAnimationBtn.disabled = n < 1;
        toAnimationBtn.classList.toggle("opacity-70", toAnimationBtn.disabled);
        toAnimationBtn.classList.toggle("cursor-not-allowed", toAnimationBtn.disabled);
      }

      function renderManualList(options) {
        const resetListScroll = Boolean(options && options.resetListScroll);
        const active = document.activeElement;
        if (active && manualCardList.contains(active)) {
          active.blur();
        }
        const q = manualSearchInput.value.trim().toLowerCase();
        const filtered = remainingDeck.filter((card) => manualSearchMatches(card, q));
        manualCardList.innerHTML = "";

        if (filtered.length === 0) {
          manualCardList.innerHTML = '<p class="text-sm text-nomad-deep/80">No hay cartas para ese filtro.</p>';
          return;
        }

        for (const card of filtered) {
          const { label, input } = buildManualCardThumbLabel(card);
          if (manualSelected.has(card.id)) input.checked = true;
          manualCardList.appendChild(label);
        }
        if (resetListScroll) {
          manualCardList.scrollTop = 0;
        }
      }

      function renderManualPickGrid(options) {
        const resetListScroll = Boolean(options && options.resetListScroll);
        const active = document.activeElement;
        if (active && manualPickModalGrid.contains(active)) {
          active.blur();
        }
        const q = manualPickSearchInput.value.trim().toLowerCase();
        const filtered = remainingDeck.filter((card) => manualSearchMatches(card, q));
        manualPickModalGrid.innerHTML = "";
        refreshManualPickSelectionLabel();

        if (filtered.length === 0) {
          manualPickModalGrid.innerHTML =
            '<p class="col-span-full text-sm text-nomad-deep/80">No hay cartas para ese filtro.</p>';
          return;
        }

        for (const card of filtered) {
          const { label, input } = buildManualCardThumbLabel(card);
          input.checked = manualDeckPickSelections.has(card.id);
          input.addEventListener("change", () => {
            if (input.checked) {
              manualDeckPickSelections.add(card.id);
              if (manualPickSearchInput.value !== "") {
                manualPickSearchInput.value = "";
                renderManualPickGrid({ resetListScroll: true });
              }
            } else {
              manualDeckPickSelections.delete(card.id);
            }
            refreshManualPickSelectionLabel();
          });
          manualPickModalGrid.appendChild(label);
        }
        if (resetListScroll) {
          manualPickModalGrid.scrollTop = 0;
        }
      }

      async function openManualPickModal() {
        manualDeckPickSelections = new Set();
        manualPickModalHelp.textContent =
          "Marca las cartas que salieron en esta tirada. Cuántas más elijas, más cartas revelará esta ronda y del mazo saldrá ese mismo número.";
        manualPickSearchInput.value = "";
        refreshManualPickSelectionLabel();
        manualPickModal.classList.remove("hidden");
        await ensureTarotMeaningsLoaded();
        renderManualPickGrid({ resetListScroll: true });
      }

      function closeManualPickModal() {
        manualPickModal.classList.add("hidden");
        manualDeckPickSelections = new Set();
        manualPickModalGrid.innerHTML = "";
        manualPickSearchInput.value = "";
        refreshManualPickSelectionLabel();
      }

      function enterStep2(mode) {
        currentMode = mode;
        manualSelected.clear();
        updateRemainingText();
        drawCountInput.value = "3";
        drawCountInput.max = String(Math.max(1, remainingDeck.length));
        randomDrawCountBlock.classList.toggle("hidden", mode === "manual");
        manualConfig.classList.toggle("hidden", mode !== "manual");
        placeDeckModeToggle(mode);
        if (mode === "manual") {
          renderManualList({ resetListScroll: true });
          setManualHelper();
        } else {
          toAnimationBtn.disabled = false;
          toAnimationBtn.classList.remove("opacity-70", "cursor-not-allowed");
        }
        void setStep(2);
      }

      function pickCardsForCurrentMode() {
        if (currentMode === "random") {
          const count = readCount();
          if (!count) {
            alert("Ingresa una cantidad valida de cartas.");
            return null;
          }
          return shuffle([...remainingDeck]).slice(0, count);
        }

        if (manualSelected.size < 1) {
          alert("Selecciona al menos una carta.");
          return null;
        }
        return [...manualSelected].map((id) => remainingDeck.find((card) => card.id === id)).filter(Boolean);
      }

      async function animateReveal(cards, roundIndex, opts) {
        const instant = Boolean(opts && opts.instant);
        if (!instant) animating = true;
        const mediaReady = preloadCardMedia(cards);
        await Promise.all([
          ensureTarotMeaningsLoaded(),
          instant ? mediaReady : withTimeout(mediaReady, 3500)
        ]);
        renderDeckPile();

        if (!mahjongStrip) {
          mahjongStrip = document.createElement("div");
          cardsLayer.appendChild(mahjongStrip);
        }
        mahjongStrip.className =
          "relative mx-auto flex w-full shrink-0 flex-row flex-wrap items-end justify-center gap-y-2 md:gap-y-8 self-center overflow-x-visible py-8 px-2 md:p-28";

        const L = tableCardLayout();
        const overlapPx = L.overlapPx;
        const tileW = L.tileW;
        const advance = tileW - overlapPx;

        function mahjongTilesPerRow() {
          let w = mahjongStrip.getBoundingClientRect().width;
          if (w < advance + L.stripAvailBuffer) {
            const sw = animationStage.getBoundingClientRect().width || window.innerWidth;
            w = Math.max(L.stripMinFallback, sw - L.stripWidthSlack);
          }
          return Math.max(1, Math.floor((w - tileW) / advance) + 1);
        }

        const pendingDeckDeal = [];

        cards.forEach((card, index) => {
          const stackPos = mahjongCardCount++;
          const perRow = mahjongTilesPerRow();
          const colIndex = stackPos % perRow;
          const rowIndex = Math.floor(stackPos / perRow);
          const rotDeg = +(Math.random() * 8 - 4).toFixed(2);
          const jitterX = +(Math.random() * 10 - 5).toFixed(1);
          const jitterY = +(Math.random() * 10 - 5 + roundIndex * -1.8).toFixed(1);
          const finalTransform = `translate3d(${jitterX}px, ${jitterY}px, 0) scale(1) rotate(${rotDeg}deg)`;

          const wrap = document.createElement("div");
          wrap.className = TABLE_CARD_BASE;
          wrap.style.width = `${tileW}px`;
          wrap.style.marginLeft = colIndex === 0 ? "0" : `-${overlapPx}px`;
          wrap.style.marginTop = rowIndex === 0 ? "0" : `${L.rowMarginTop}px`;
          wrap.style.zIndex = String(500 + stackPos);
          if (instant) {
            wrap.style.opacity = "1";
            wrap.style.transform = finalTransform;
            wrap.dataset.baseTransform = finalTransform;
          } else {
            wrap.classList.add("will-change-[transform,_opacity]");
            wrap.style.opacity = "0";
            wrap.style.transform = "";
            wrap.style.transition = "none";
            pendingDeckDeal.push({ wrap, innerFlip: null, finalTransform, index });
          }

          const innerFlip = document.createElement("div");
          innerFlip.className =
            "relative aspect-[350/600] w-full origin-center [transform-style:preserve-3d]";
          if (!instant) {
            innerFlip.style.transition = `transform ${CARD_ANIM.flipMs}ms ${CARD_ANIM.flipEase}`;
            pendingDeckDeal[pendingDeckDeal.length - 1].innerFlip = innerFlip;
          }
          if (instant) {
            innerFlip.classList.add("[transform:rotateY(180deg)]");
          }
          const printedTitle = cardPrintedEnglishTitleUpper(card.id);
          const facePrintRootClass = printedTitle ? ` ${CARD_FACE_PRINT_ROOT_TW}` : "";
          const printedTitleHtml = printedTitle
            ? `<div data-printed-title-bar class="${CARD_PRINTED_TITLE_BAR_CLASS}" aria-hidden="true"><span data-printed-title-text class="${CARD_PRINTED_TITLE_TEXT_CLASS}">${escapeHtml(
                printedTitle
              )}</span></div>`
            : "";
          innerFlip.innerHTML = `
            <div class="absolute inset-0 box-border overflow-hidden rounded-none border-2 border-black bg-nomad-paper [backface-visibility:hidden]">
              <img src="${TAROT_CARD_BACK_SRC}" alt="" class="block h-full w-full object-cover object-center" decoding="async" loading="lazy" />
            </div>
            <div class="absolute inset-0 overflow-hidden rounded-none bg-nomad-paper [backface-visibility:hidden] [transform:rotateY(180deg)]${facePrintRootClass}">
              <img src="${card.staticImg || card.img}" alt="" class="card-face-media block h-full w-full object-contain object-center bg-nomad-paper${cardFaceImageScaleClass(
                card.id
              )}" decoding="async" loading="lazy" />
              ${printedTitleHtml}
            </div>
          `;
          wrap.appendChild(innerFlip);
          attachTableCardDetailBehavior(wrap, card, { tableRoundIndex: roundIndex });
          attachCardHoverFrontBehavior(wrap);
          const faceImg = wrap.querySelector(".card-face-media");
          attachCardAnimatedPreviewBehavior(wrap, faceImg, card);
          mahjongStrip.appendChild(wrap);
          if (printedTitle) {
            const titleBarEl = wrap.querySelector("[data-printed-title-bar]");
            if (titleBarEl) fitCardPrintedTitleBar(titleBarEl);
          }
        });

        if (!instant && pendingDeckDeal.length > 0) {
          await new Promise((resolve) => {
            requestAnimationFrame(() => requestAnimationFrame(resolve));
          });
          const anchor = deckDealAnchorScreen();
          for (const item of pendingDeckDeal) {
            const { wrap, innerFlip, finalTransform, index } = item;
            const r = wrap.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.bottom - 2;
            const dx = anchor.x - cx;
            const dy = anchor.y - cy;
            const tilt = CARD_ANIM.dealTiltDeg + (Math.random() * 2.2 - 1.1);
            wrap.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${CARD_ANIM.deckFromScale}) rotate(${tilt.toFixed(2)}deg)`;
            void wrap.offsetHeight;
            wrap.style.transition = `transform ${CARD_ANIM.dealMs}ms ${CARD_ANIM.dealEase}, opacity ${CARD_ANIM.opacityMs}ms ${CARD_ANIM.opacityEase}`;

            const dealDelay = CARD_ANIM.staggerMs * index;
            window.setTimeout(() => {
              wrap.style.opacity = "1";
              wrap.style.transform = finalTransform;
              wrap.dataset.baseTransform = finalTransform;
            }, dealDelay);
            window.setTimeout(() => {
              innerFlip.classList.add("[transform:rotateY(180deg)]");
            }, dealDelay + CARD_ANIM.flipDelayMs);
            const cleanupMs =
              dealDelay + Math.max(CARD_ANIM.dealMs, CARD_ANIM.flipDelayMs + CARD_ANIM.flipMs) + 80;
            window.setTimeout(() => {
              wrap.classList.remove("will-change-[transform,_opacity]");
              wrap.classList.add("will-change-auto");
              wrap.style.transition = "";
            }, cleanupMs);
          }
        }

        if (instant) return;

        const lastStart = Math.max(0, (cards.length - 1) * CARD_ANIM.staggerMs);
        const totalMs =
          lastStart +
          Math.max(CARD_ANIM.dealMs, CARD_ANIM.flipDelayMs + CARD_ANIM.flipMs) +
          220;
        await new Promise((resolve) => window.setTimeout(resolve, totalMs));
        animating = false;
        if (modalOpenRequested && remainingDeck.length > 0) {
          modalOpenRequested = false;
          window.setTimeout(() => openDeckDrawPrompt(), 240);
        }
      }

      async function startAnimationStep() {
        if (animating) return;
        const selected = pickCardsForCurrentMode();
        if (!selected || selected.length === 0) return;

        await revealSelectedCards(selected);

        if (remainingDeck.length === 0) {
          alert("Se acabaron las cartas del mazo.");
        }
      }

      async function revealSelectedCards(selected) {
        const roundIndex = revealedRounds.length;
        revealedRounds.push([...selected]);
        const selectedIds = new Set(selected.map((card) => card.id));
        remainingDeck = remainingDeck.filter((card) => !selectedIds.has(card.id));
        manualSelected.clear();
        updateRemainingText();
        await setStep(3);
        persistSession();
        await animateReveal(selected, roundIndex);
      }

      function encodeRevealedRounds(rounds) {
        return rounds
          .map((round) => round.map((card) => card.id).join(""))
          .filter((s) => s.length > 0)
          .join(".");
      }

      function decodeRevealedRounds(encoded, deck) {
        if (!encoded) return [];
        const byId = new Map(deck.map((card) => [card.id, card]));
        const seen = new Set();
        const rounds = [];
        for (const group of String(encoded).split(".")) {
          const cards = [];
          for (let i = 0; i + 3 <= group.length; i += 3) {
            const id = group.slice(i, i + 3);
            const card = byId.get(id);
            if (card && !seen.has(id)) {
              seen.add(id);
              cards.push(card);
            }
          }
          if (cards.length > 0) rounds.push(cards);
        }
        return rounds;
      }

      function applyDeckMode(newMode) {
        deckMode = newMode === "major" ? "major" : "full";
        fullDeck = buildDeck(deckMode);
        if (deckModeToggle) {
          deckModeToggle.checked = deckMode === "major";
        }
      }

      /** Al pasar a solo mayores, quita menores; al volver al mazo completo, conserva todo lo elegido. */
      function filterManualIdsForDeckMode(selectedIds, mode) {
        if (mode === "major") {
          return new Set([...selectedIds].filter((id) => typeof id === "string" && id.startsWith("m")));
        }
        return new Set(selectedIds);
      }

      function persistDeckMode() {
        try {
          const url = new URL(window.location.href);
          if (currentShareCode) {
            url.searchParams.delete(DECK_MODE_URL_PARAM);
          } else if (deckMode === "major") {
            url.searchParams.set(DECK_MODE_URL_PARAM, "major");
          } else {
            url.searchParams.delete(DECK_MODE_URL_PARAM);
          }
          window.history.replaceState(null, "", url.toString());
        } catch (_) {}
        try {
          if (deckMode === "major") {
            window.localStorage.setItem(DECK_MODE_STORAGE_KEY, "major");
          } else {
            window.localStorage.removeItem(DECK_MODE_STORAGE_KEY);
          }
        } catch (_) {}
      }

      function readDeckModeFromUrlOrStorage() {
        let value = "";
        try {
          value = new URL(window.location.href).searchParams.get(DECK_MODE_URL_PARAM) || "";
        } catch (_) {
          value = "";
        }
        if (!value) {
          try {
            value = window.localStorage.getItem(DECK_MODE_STORAGE_KEY) || "";
          } catch (_) {
            value = "";
          }
        }
        return value === "major" ? "major" : "full";
      }

      function changeDeckModeFromToggle() {
        const newMode = deckModeToggle.checked ? "major" : "full";
        if (newMode === deckMode) return;
        applyDeckMode(newMode);
        revealedRounds = [];
        remainingDeck = [...fullDeck];
        manualSelected = filterManualIdsForDeckMode(manualSelected, newMode);
        manualDeckPickSelections = filterManualIdsForDeckMode(manualDeckPickSelections, newMode);
        mahjongCardCount = 0;
        if (mahjongStrip) {
          mahjongStrip.innerHTML = "";
        }
        animating = false;
        modalOpenRequested = false;
        cardNotes.clear();
        updateRemainingText();
        renderDeckPile();
        if (currentMode === "manual") {
          renderManualList({ resetListScroll: true });
          setManualHelper();
          if (manualPickModal && !manualPickModal.classList.contains("hidden")) {
            renderManualPickGrid({ resetListScroll: true });
          }
        }
        persistDeckMode();
        persistSession();
        persistCardNotes();
      }

      function persistSession() {
        const encoded = encodeRevealedRounds(revealedRounds);
        try {
          const url = new URL(window.location.href);
          if (currentShareCode) {
            url.searchParams.delete(SESSION_URL_PARAM);
          } else if (encoded) {
            url.searchParams.set(SESSION_URL_PARAM, encoded);
          } else {
            url.searchParams.delete(SESSION_URL_PARAM);
          }
          window.history.replaceState(null, "", url.toString());
        } catch (_) {}
        try {
          if (encoded) {
            window.localStorage.setItem(SESSION_STORAGE_KEY, encoded);
          } else {
            window.localStorage.removeItem(SESSION_STORAGE_KEY);
          }
        } catch (_) {}
      }

      function readSessionFromUrlOrStorage() {
        let encoded = "";
        try {
          encoded = new URL(window.location.href).searchParams.get(SESSION_URL_PARAM) || "";
        } catch (_) {
          encoded = "";
        }
        if (!encoded) {
          try {
            encoded = window.localStorage.getItem(SESSION_STORAGE_KEY) || "";
          } catch (_) {
            encoded = "";
          }
        }
        return encoded;
      }

      async function restoreSessionIfAny() {
        const encoded = readSessionFromUrlOrStorage();
        if (!encoded) return false;
        const rounds = decodeRevealedRounds(encoded, fullDeck);
        if (rounds.length === 0) return false;

        revealedRounds = rounds;
        const usedIds = new Set();
        for (const round of rounds) for (const c of round) usedIds.add(c.id);
        remainingDeck = fullDeck.filter((c) => !usedIds.has(c.id));
        currentMode = currentMode || "random";
        updateRemainingText();
        setStep(3, { instant: true });
        await ensureTarotMeaningsLoaded();
        for (let i = 0; i < rounds.length; i += 1) {
          await animateReveal(rounds[i], i, { instant: true });
        }
        renderDeckPile();
        persistSession();
        return true;
      }

      async function fetchSharedReadingByCode(code) {
        if (!supabaseClient || !code) return null;
        try {
          const { data, error } = await supabaseClient
            .from("readings")
            .select("session, notes, deck_mode")
            .eq("code", code)
            .maybeSingle();
          if (error) {
            console.warn("Supabase fetch failed", error);
            return null;
          }
          return data || null;
        } catch (err) {
          console.warn("Supabase fetch exception", err);
          return null;
        }
      }

      function applySharedReadingNotes(notesValue) {
        cardNotes.clear();
        if (!notesValue || typeof notesValue !== "object") return;
        for (const [id, val] of Object.entries(notesValue)) {
          if (typeof id === "string" && typeof val === "string" && val.length > 0) {
            cardNotes.set(id, val);
          }
        }
      }

      async function restoreSessionFromShared(data) {
        if (!data) return false;
        const sessionEncoded = String(data.session || "");
        const rounds = decodeRevealedRounds(sessionEncoded, fullDeck);
        revealedRounds = rounds;
        const usedIds = new Set();
        for (const round of rounds) for (const c of round) usedIds.add(c.id);
        remainingDeck = fullDeck.filter((c) => !usedIds.has(c.id));
        currentMode = currentMode || "random";
        updateRemainingText();
        if (rounds.length === 0) {
          renderDeckPile();
          return true;
        }
        setStep(3, { instant: true });
        await ensureTarotMeaningsLoaded();
        for (let i = 0; i < rounds.length; i += 1) {
          await animateReveal(rounds[i], i, { instant: true });
        }
        renderDeckPile();
        return true;
      }

      function resetSession() {
        revealedRounds = [];
        remainingDeck = [...fullDeck];
        manualSelected.clear();
        manualDeckPickSelections = new Set();
        mahjongCardCount = 0;
        if (mahjongStrip) {
          mahjongStrip.innerHTML = "";
        }
        animating = false;
        modalOpenRequested = false;
        cardNotes.clear();
        currentShareCode = null;
        try {
          window.localStorage.removeItem(SESSION_STORAGE_KEY);
        } catch (_) {}
        try {
          const url = new URL(window.location.href);
          url.searchParams.delete(SESSION_URL_PARAM);
          url.searchParams.delete(SHARE_CODE_URL_PARAM);
          window.history.replaceState(null, "", url.toString());
        } catch (_) {}
        persistCardNotes();
        updateRemainingText();
        renderDeckPile();
        void setStep(1);
      }

      async function persistSessionToSupabase() {
        if (!supabaseClient) return false;
        const sessionEncoded = encodeRevealedRounds(revealedRounds);
        const notesObj = cardNotesToObject();
        const payload = {
          session: sessionEncoded,
          notes: notesObj,
          deck_mode: deckMode === "major" ? "major" : "full",
        };

        if (currentShareCode) {
          try {
            const { error } = await supabaseClient
              .from("readings")
              .update({ ...payload, updated_at: new Date().toISOString() })
              .eq("code", currentShareCode);
            if (error) {
              console.warn("Supabase update failed", error);
              return false;
            }
            return true;
          } catch (err) {
            console.warn("Supabase update exception", err);
            return false;
          }
        }

        for (let attempt = 0; attempt < 5; attempt += 1) {
          const code = generateShareCode();
          try {
            const { error } = await supabaseClient
              .from("readings")
              .insert({ code, ...payload });
            if (!error) {
              currentShareCode = code;
              writeShareCodeToUrl(code);
              return true;
            }
            if (error && (error.code === "23505" || /duplicate key/i.test(error.message || ""))) {
              continue;
            }
            console.warn("Supabase insert failed", error);
            return false;
          } catch (err) {
            console.warn("Supabase insert exception", err);
            return false;
          }
        }
        return false;
      }

      async function copyShareLinkToClipboard() {
        persistCardNotes();
        if (shareLinkBtn) shareLinkBtn.disabled = true;
        const uploaded = await persistSessionToSupabase();

        if (!uploaded) {
          if (shareLinkBtn) {
            const originalHTML = shareLinkBtn.innerHTML;
            shareLinkBtn.textContent = "Sin conexion";
            window.setTimeout(() => {
              shareLinkBtn.innerHTML = originalHTML;
              shareLinkBtn.disabled = false;
            }, 1800);
          }
          alert(
            "No se pudo guardar la tirada en el servidor. Revisa tu conexion e intenta de nuevo. No se ha copiado ningun enlace para no exponer tus notas."
          );
          return;
        }

        const url = window.location.href;
        let copied = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(url);
            copied = true;
          }
        } catch (_) {}
        if (!copied) {
          try {
            const ta = document.createElement("textarea");
            ta.value = url;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            copied = document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (_) {}
        }
        if (shareLinkBtn) {
          const originalHTML = shareLinkBtn.innerHTML;
          shareLinkBtn.textContent = copied ? "Copiado!" : "No se pudo copiar";
          shareLinkBtn.disabled = true;
          window.setTimeout(() => {
            shareLinkBtn.innerHTML = originalHTML;
            shareLinkBtn.disabled = false;
          }, 1500);
        }
      }

      function openRandomDrawCountModal() {
        modalDrawCountInput.max = String(remainingDeck.length);
        modalDrawCountInput.value = String(Math.min(3, remainingDeck.length));
        drawModal.classList.remove("hidden");
        modalDrawCountInput.focus();
      }

      function openDeckDrawPrompt() {
        if (remainingDeck.length === 0) return;
        if (animating) {
          modalOpenRequested = true;
          return;
        }
        if (currentMode === "manual") {
          void openManualPickModal();
        } else {
          openRandomDrawCountModal();
        }
      }

      function closeDrawModal() {
        modalOpenRequested = false;
        drawModal.classList.add("hidden");
      }

      async function confirmDrawFromModal() {
        if (animating) return;
        const count = Number(modalDrawCountInput.value);
        if (!Number.isInteger(count) || count < 1 || count > remainingDeck.length) {
          alert("Cantidad invalida.");
          return;
        }
        closeDrawModal();
        const selected = shuffle([...remainingDeck]).slice(0, count);
        await revealSelectedCards(selected);
        if (remainingDeck.length === 0) {
          alert("Se acabaron las cartas del mazo.");
        }
      }

      function wireStep1VideoHover(btn) {
        const video = btn.querySelector("video");
        if (!video) return;
        const play = () => {
          void video.play();
        };
        const stop = () => {
          video.pause();
          video.currentTime = 0;
        };
        btn.addEventListener("mouseenter", play);
        btn.addEventListener("mouseleave", stop);
        btn.addEventListener("focusin", play);
        btn.addEventListener("focusout", stop);
      }
      wireStep1VideoHover(goRandomBtn);
      wireStep1VideoHover(goManualBtn);

      goRandomBtn.addEventListener("click", () => enterStep2("random"));
      goManualBtn.addEventListener("click", () => enterStep2("manual"));
      backToModeBtn.addEventListener("click", () => void setStep(1));
      toAnimationBtn.addEventListener("click", startAnimationStep);
      shareLinkBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        void copyShareLinkToClipboard();
      });
      deckModeToggle.addEventListener("change", () => {
        changeDeckModeFromToggle();
      });
      resetSessionBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        if (revealedRounds.length > 0) {
          if (!window.confirm("¿Empezar una nueva sesion? Se perderan las cartas actuales.")) return;
        }
        resetSession();
      });
      deckPile.addEventListener("click", (event) => {
        event.stopPropagation();
        hideActiveCardTooltip();
        openDeckDrawPrompt();
      });
      modalCancelBtn.addEventListener("click", closeDrawModal);
      modalConfirmBtn.addEventListener("click", () => {
        void confirmDrawFromModal();
      });
      drawModal.addEventListener("click", (event) => {
        if (event.target === drawModal) closeDrawModal();
      });

      manualPickCancelBtn.addEventListener("click", () => {
        closeManualPickModal();
      });
      manualPickModal.addEventListener("click", (event) => {
        if (event.target === manualPickModal) closeManualPickModal();
      });
      manualPickConfirmBtn.addEventListener("click", () => {
        void (async () => {
          if (animating) return;
          if (manualDeckPickSelections.size < 1) {
            alert("Selecciona al menos una carta.");
            return;
          }
          const selected = [...manualDeckPickSelections]
            .map((id) => remainingDeck.find((c) => c.id === id))
            .filter(Boolean);
          if (selected.length < 1) {
            alert("Seleccion invalida.");
            return;
          }
          manualPickModal.classList.add("hidden");
          manualDeckPickSelections.clear();
          manualPickModalGrid.innerHTML = "";
          await revealSelectedCards(selected);
          if (remainingDeck.length === 0) {
            alert("Se acabaron las cartas del mazo.");
          }
        })();
      });

      manualSearchInput.addEventListener("input", renderManualList);

      manualPickSearchInput.addEventListener("input", () => renderManualPickGrid());

      manualCardList.addEventListener("change", (event) => {
        const target = event.target;
        if (!target || target.tagName !== "INPUT") return;
        const cardId = target.getAttribute("data-card-id");
        if (!cardId) return;

        if (target.checked) {
          manualSelected.add(cardId);
          if (manualSearchInput.value !== "") {
            manualSearchInput.value = "";
            renderManualList({ resetListScroll: true });
          }
        } else {
          manualSelected.delete(cardId);
        }
        setManualHelper();
      });

      deckPile.addEventListener("animationend", () => {
        deckPile.classList.remove("animate-deck-bounce-mobile");
      });

      window.setInterval(() => {
        if (viewportIsMdUp()) return;
        if (step3.classList.contains("hidden")) return;
        if (animating) return;
        if (remainingDeck.length === 0) return;
        if (deckPile.classList.contains("animate-deck-bounce-mobile")) return;
        deckPile.classList.add("animate-deck-bounce-mobile");
      }, 10000);

      function bindPingPongVideo(video) {
        if (!video) return;

        let direction = 1;
        let reverseRaf = 0;
        let reverseLastTs = 0;

        function stopReverse() {
          if (reverseRaf) {
            cancelAnimationFrame(reverseRaf);
            reverseRaf = 0;
          }
          reverseLastTs = 0;
        }

        function playForward() {
          direction = 1;
          stopReverse();
          video.playbackRate = 1;
          if (video.currentTime <= 0.01) {
            video.currentTime = 0;
          }
          void video.play().catch(() => {});
        }

        function reverseFrame(ts) {
          if (!reverseLastTs) reverseLastTs = ts;
          const dt = Math.min((ts - reverseLastTs) / 1000, 0.05);
          reverseLastTs = ts;

          const nextTime = video.currentTime - dt;
          if (nextTime <= 0) {
            video.currentTime = 0;
            playForward();
            return;
          }

          video.currentTime = nextTime;
          reverseRaf = requestAnimationFrame(reverseFrame);
        }

        function startReverse() {
          if (direction === -1) return;
          direction = -1;
          video.pause();
          stopReverse();
          reverseRaf = requestAnimationFrame(reverseFrame);
        }

        function onForwardNearEnd() {
          if (direction !== 1) return;
          const duration = video.duration;
          if (!Number.isFinite(duration) || duration <= 0) return;
          if (video.currentTime < duration - 0.08) return;
          startReverse();
        }

        video.addEventListener("ended", startReverse);
        video.addEventListener("timeupdate", onForwardNearEnd);

        if (video.readyState >= 1) {
          playForward();
        } else {
          video.addEventListener("loadedmetadata", playForward, { once: true });
        }
      }

      bindPingPongVideo(document.getElementById("iGotCardsVideo"));

      bindQuantityStepper("drawCountInput", "drawCountDec", "drawCountInc");
      bindQuantityStepper("modalDrawCountInput", "modalDrawCountDec", "modalDrawCountInc");

      void (async () => {
        const shareCodeFromUrl = readShareCodeFromUrl();
        let sharedReading = null;
        if (shareCodeFromUrl) {
          sharedReading = await fetchSharedReadingByCode(shareCodeFromUrl);
          if (sharedReading) {
            currentShareCode = shareCodeFromUrl;
          } else {
            try {
              const url = new URL(window.location.href);
              url.searchParams.delete(SHARE_CODE_URL_PARAM);
              window.history.replaceState(null, "", url.toString());
            } catch (_) {}
          }
        }

        if (sharedReading) {
          applyDeckMode(sharedReading.deck_mode === "major" ? "major" : "full");
          remainingDeck = [...fullDeck];
          applySharedReadingNotes(sharedReading.notes);
          writeShareCodeToUrl(currentShareCode);
        } else {
          applyDeckMode(readDeckModeFromUrlOrStorage());
          remainingDeck = [...fullDeck];
          readCardNotesFromUrlOrStorage();
        }
        updateRemainingText();
        setStep(1, { instant: true });
        renderDeckPile();

        try {
          await preloadCardMedia(fullDeck, { waitForAnimated: true });
        } catch (_) {}
        hideStartupLoader();

        try {
          if (sharedReading) {
            await restoreSessionFromShared(sharedReading);
          } else {
            await restoreSessionIfAny();
          }
        } catch (_) {}
      })();
    </script>
  </body>
</html>
