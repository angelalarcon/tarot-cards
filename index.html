<!doctype html>
<html lang="es" class="[color-scheme:light]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tarot - Flujo por Pantallas</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2072%22%3E%3Crect%20x%3D%2211%22%20y%3D%226%22%20width%3D%2226%22%20height%3D%2260%22%20rx%3D%225%22%20fill%3D%22%236B7B91%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/ananda-black" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"DM Sans"', "system-ui", "sans-serif"],
              serif: ['ui-serif', "Georgia", '"Times New Roman"', '"DejaVu Serif"', "Times", "serif"],
              ananda: ['"Ananda Black"', "cursive"],
            },
            colors: {
              nomad: {
                paper: "#F4F1EA",
                ink: "#333344",
                sea: "#6B7B91",
                ice: "#A9C6E0",
                peach: "#F7E3E1",
                dusk: "#E8D1D1",
                mist: "#B0C4DE",
                sage: "#7A9E7E",
                mint: "#A8C69F",
                cream: "#F5F5F5",
                deep: "#4A4E69",
              },
            },
            backgroundImage: {
              "noise-grain":
                'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 256 256\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'n\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.75\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\'/%3E%3C/svg%3E")',
            },
            keyframes: {
              deckBounceMobile: {
                "0%, 60%, 100%": { transform: "translateY(0)" },
                "20%": { transform: "translateY(-12px)" },
                "40%": { transform: "translateY(-5px)" },
              },
              loaderPulse: {
                "0%, 100%": { opacity: "0.55", transform: "scale(0.98)" },
                "50%": { opacity: "1", transform: "scale(1.02)" },
              },
            },
            animation: {
              "deck-bounce-mobile": "deckBounceMobile 1.2s ease-in-out",
              "loader-pulse": "loaderPulse 1.1s ease-in-out infinite",
            },
          },
        },
        plugins: [
          function ({ addComponents }) {
            const tarotPhotoBase = {
              content: '""',
              position: "absolute",
              left: "50%",
              top: "50%",
              width: "100vh",
              height: "100vw",
              transform: "translate(-50%, -50%) rotate(90deg)",
              backgroundImage: 'url("./assets/background.jpg")',
              backgroundSize: "cover",
              backgroundRepeat: "no-repeat",
              pointerEvents: "none",
            };
            const tarotOverlayBase = {
              content: '""',
              position: "absolute",
              inset: "0",
              backgroundSize: "cover",
              backgroundRepeat: "no-repeat",
              pointerEvents: "none",
            };
            addComponents({
              ".bg-tarot-sky": {
                position: "relative",
                isolation: "isolate",
                "&::before": {
                  ...tarotPhotoBase,
                  zIndex: -2,
                  backgroundPosition: "center",
                },
              },
              ".bg-tarot-spread": {
                position: "relative",
                isolation: "isolate",
                "&::before": {
                  ...tarotPhotoBase,
                  zIndex: -2,
                  backgroundPosition: "center bottom",
                },
                "&::after": {
                  ...tarotOverlayBase,
                  zIndex: -1,
                  background:
                    "rgba(255, 255, 255, 0.4)",
                },
              },
            });
          },
        ],
      };
    </script>
  </head>
  <body class="min-h-screen overflow-hidden bg-nomad-paper font-sans text-nomad-ink antialiased before:fixed before:inset-0 before:z-[1] before:pointer-events-none before:opacity-[0.04] before:[content:''] before:bg-noise-grain before:bg-cover before:bg-center before:bg-no-repeat">
    <div id="startupLoader" class="fixed inset-0 z-[9999] grid place-items-center bg-nomad-paper">
      <div class="flex flex-col items-center gap-3">
        <svg class="h-11 w-11 shrink-0 animate-loader-pulse text-nomad-sea" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="4" y="6" width="22" height="36" rx="2" stroke="currentColor" stroke-width="2.2" fill="none" transform="rotate(-8 15 24)" />
          <rect x="16" y="10" width="22" height="36" rx="2" stroke="currentColor" stroke-width="2.2" fill="rgba(107,123,145,0.12)" transform="rotate(6 27 28)" />
        </svg>
        <p class="text-sm font-semibold tracking-[0.18em] text-nomad-deep">CARGANDO...</p>
      </div>
    </div>
    <div id="appContent" class="invisible relative z-[2] opacity-0 transition-opacity duration-300">
    <div
      id="tarotBackdrop"
      class="pointer-events-none fixed inset-0 z-0 min-h-[100dvh] min-w-[200px] bg-tarot-sky"
      aria-hidden="true"
    ></div>
    <main class="relative z-10 mx-auto max-w-6xl px-4 py-8 md:py-10 min-h-screen flex flex-col justify-center">
      <section id="step1" class="opacity-100 transition-opacity duration-300 ease-out">
        <h1 class="text-center font-ananda text-5xl font-normal normal-case leading-none tracking-normal text-white md:text-nomad-ink [font-synthesis:none] [text-rendering:optimizeLegibility] md:text-8xl">
          El Tarot 
          <br>
          de Anais
        </h1>
        <div class="mt-6 grid gap-4 md:grid-cols-2">
          <button
            id="goRandomBtn"
            class="flex items-center justify-center gap-4 rounded-md bg-[#23305A] px-4 py-4 text-left text-white shadow-none transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nomad-ink"
          >
            <video src="./assets/do-a-reading.mp4" class="w-20 md:w-40" muted loop playsinline preload="metadata"></video>
            <div class="flex flex-col gap-3">
              <div class="text-lg font-semibold uppercase tracking-wide">Hazme una lectura</div>
              <p class="font-normal leading-snug">
                Saca cartas al azar.
              </p>
            </div>
          </button>
          <button
            id="goManualBtn"
            class="flex items-center justify-center gap-4 rounded-md bg-[#595C5B] px-4 py-4 text-left text-white transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nomad-ink"
          >
            <video src="./assets/i-got-cards.mp4" class="w-20 md:w-40" muted loop playsinline preload="metadata"></video>
            <div class="flex flex-col gap-3">
              <div class="text-lg font-semibold uppercase tracking-wide">Tengo mis cartas</div>
              <p class="font-normal leading-snug">
                Tiraste con tu mazo en casa?
              </p>
              <ol class="list-decimal list-inside text-sm font-normal leading-snug flex flex-col gap-2">
                <li>Marca las cartas que salieron</li>
                <li>Agrega notas a cada carta</li>
                <li>Comparte tu tirada</li>
              </ol>
            </div>
          </button>
        </div>
      </section>

      <section id="step2" class="hidden opacity-100 transition-opacity duration-300 ease-out">
        <div
          id="randomDrawCountBlock"
          class="flex flex-col items-center p-4 text-center"
        >
          <label for="drawCountInput" class="block w-full text-lg font-medium text-nomad-deep sm:text-xl">Cuantas cartas quieres sacar</label>
          <div
            class="mt-2 flex w-full max-w-md shrink-0 self-center items-stretch rounded-full border-2 border-black bg-nomad-cream px-0.5 py-0.5 shadow-inner"
          >
            <button
              type="button"
              id="drawCountDec"
              class="flex shrink-0 items-center justify-center rounded-full p-8 text-nomad-ink transition hover:bg-nomad-ice/50 active:bg-nomad-ice/70 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nomad-deep"
              aria-label="Menos cartas"
            >
              <svg class="h-9 w-9 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6" /></svg>
            </button>
            <input
              id="drawCountInput"
              type="number"
              min="1"
              max="78"
              value="3"
              inputmode="numeric"
              class="min-w-0 flex-1 border-0 bg-transparent py-2 text-center text-7xl font-bold tabular-nums text-nomad-sea outline-none ring-0 [appearance:textfield] [&::-webkit-inner-spin-button]:m-0 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:m-0 [&::-webkit-outer-spin-button]:appearance-none focus:ring-0"
            />
            <button
              type="button"
              id="drawCountInc"
              class="flex shrink-0 items-center justify-center rounded-full p-8 text-nomad-ink transition hover:bg-nomad-ice/50 active:bg-nomad-ice/70 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nomad-deep"
              aria-label="Mas cartas"
            >
              <svg class="h-9 w-9 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6l6 6-6 6" /></svg>
            </button>
          </div>
          <div id="deckModeToggleSlotRandom" class="mt-4 flex w-full max-w-md justify-center self-center">
            <label id="deckModeToggleWrap" class="flex shrink-0 cursor-pointer items-center gap-2 text-left text-sm sm:gap-3">
              <span class="leading-snug font-semibold">Solo Arcanos Mayores</span>
              <div class="relative flex shrink-0 items-center gap-1">
                <input
                  id="deckModeToggle"
                  type="checkbox"
                  class="peer absolute inset-0 cursor-pointer opacity-0 disabled:pointer-events-none disabled:cursor-not-allowed"
                  aria-label="Solo arcanos mayores"
                />
                <span
                  class="flex h-[24px] w-[40px] rounded-full border bg-nomad-mist/80 p-[1px] transition-all duration-500 peer-checked:justify-end peer-checked:bg-nomad-mint"
                  aria-hidden="true"
                >
                  <span class="h-full w-[22px] rounded-full bg-white"></span>
                </span>
              </div>
            </label>
          </div>
        </div>

        <div id="manualConfig" class="mt-5 hidden rounded-md bg-nomad-cream/95 p-4">
          <p id="manualHelper" class="text-lg text-nomad-deep/95 sm:text-xl">Selecciona cartas del listado.</p>
          <div class="mt-3 flex min-w-0 flex-row items-center gap-3">
            <input
              id="manualSearchInput"
              type="text"
              placeholder="Buscar carta..."
              class="min-w-0 flex-1 rounded-md bg-white px-3 py-2 text-nomad-ink outline-none ring-nomad-sea transition focus:ring-2 focus:ring-nomad-sea"
            />
            <div id="deckModeToggleSlotManual" class="flex shrink-0 items-center"></div>
          </div>
          <div
            id="manualCardList"
            class="mt-3 grid max-h-80 grid-cols-3 gap-2 overflow-y-auto pr-1 sm:max-h-[calc(100vh_-_300px)] sm:grid-cols-4 lg:grid-cols-5"
          ></div>
        </div>

        <div class="mx-auto mt-6 flex w-full max-w-md justify-center gap-3">
          <button id="backToModeBtn" class="rounded-md bg-white px-4 py-2 text-nomad-ink transition hover:bg-nomad-dusk/40">
            Volver
          </button>
          <button
            id="toAnimationBtn"
            class="min-w-0 flex-1 rounded-md bg-nomad-sage px-4 py-2 text-center font-semibold text-white transition hover:bg-nomad-deep"
          >
            Sacar cartas
          </button>
        </div>
      </section>

      <section
        id="step3"
        class="fixed inset-0 z-40 hidden opacity-100 transition-opacity duration-300 ease-out"
      >
        <div
          class="pointer-events-none absolute inset-0 z-0 bg-tarot-spread"
          aria-hidden="true"
        ></div>
        <div class="absolute right-4 top-4 z-20 flex items-center gap-2 pr-3">
          <button
            id="resetSessionBtn"
            type="button"
            class="rounded-md border-2 border-black bg-nomad-cream px-4 py-2 text-sm font-semibold text-nomad-deep transition hover:bg-nomad-peach"
          >
            Nueva sesion
          </button>
          <button
            id="shareLinkBtn"
            type="button"
            aria-label="Copiar URL"
            title="Copiar URL"
            class="flex items-center justify-center rounded-md border-2 border-black bg-nomad-sea px-4 py-2 text-white transition hover:bg-nomad-deep"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>
        </div>

        <div id="animationStage" class="relative z-10 h-screen overflow-auto scroll-smooth">
          <div
            id="cardsLayer"
            class="relative z-0 flex min-h-full flex-col items-stretch pt-12 px-6 pb-40 md:pb-52 md:pl-[11rem]"
          ></div>
          <div
            id="deckPile"
            class="fixed -bottom-16 md:bottom-4 -right-16 top-auto z-[120] h-[229px] w-[312px] translate-y-0 cursor-pointer md:bottom-auto md:right-auto md:left-8 md:top-1/2 md:h-[252px] md:w-[152px] md:-translate-y-1/2"
          ></div>
        </div>
      </section>
    </main>

    <div id="drawModal" class="fixed inset-0 z-50 hidden grid place-items-center bg-nomad-ink/40 px-3 py-3 sm:px-4">
      <div class="w-full max-w-[min(22rem,calc(100vw-1.5rem))] max-h-[calc(100dvh-1.5rem)] overflow-y-auto rounded-md border-2 border-black bg-nomad-cream p-4 shadow-none sm:max-w-sm sm:p-5">
        <h3 class="text-base font-bold text-nomad-deep sm:text-3xl">Cuantas cartas quieres sacar</h3>
        <div
          class="mt-4 flex w-full items-stretch rounded-full border-2 border-black bg-nomad-cream px-0.5 py-0.5 shadow-inner"
        >
          <button
            type="button"
            id="modalDrawCountDec"
            class="flex shrink-0 items-center justify-center rounded-full p-5 text-nomad-ink transition hover:bg-nomad-ice/50 active:bg-nomad-ice/70 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nomad-deep sm:p-8"
            aria-label="Menos cartas"
          >
            <svg class="h-8 w-8 shrink-0 sm:h-10 sm:w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6" /></svg>
          </button>
          <input
            id="modalDrawCountInput"
            type="number"
            min="1"
            value="3"
            inputmode="numeric"
            aria-label="Cantidad de cartas a sacar"
            class="min-w-0 flex-1 border-0 bg-transparent py-2 text-center text-5xl font-bold tabular-nums text-nomad-sea outline-none ring-0 [appearance:textfield] [&::-webkit-inner-spin-button]:m-0 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:m-0 [&::-webkit-outer-spin-button]:appearance-none focus:ring-0 sm:text-7xl"
          />
          <button
            type="button"
            id="modalDrawCountInc"
            class="flex shrink-0 items-center justify-center rounded-full p-5 text-nomad-ink transition hover:bg-nomad-ice/50 active:bg-nomad-ice/70 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nomad-deep sm:p-8"
            aria-label="Mas cartas"
          >
            <svg class="h-8 w-8 shrink-0 sm:h-10 sm:w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6l6 6-6 6" /></svg>
          </button>
        </div>
        <div class="mt-4 flex gap-3">
          <button id="modalCancelBtn" class="flex-1 rounded-md border-2 border-black bg-transparent px-3 py-2 text-nomad-ink transition hover:bg-nomad-dusk/40">
            Cancelar
          </button>
          <button id="modalConfirmBtn" class="flex-1 rounded-md border-2 border-black bg-nomad-sage px-3 py-2 font-semibold text-white transition hover:bg-nomad-deep">
            Sacar
          </button>
        </div>
      </div>
    </div>

    <div id="manualPickModal" class="fixed inset-0 z-[55] hidden grid place-items-center bg-nomad-ink/45 px-3 py-4">
      <div
        class="flex max-h-[min(90vh,720px)] w-full max-w-3xl flex-col overflow-hidden rounded-md border-2 border-black bg-nomad-cream p-4 shadow-none sm:p-5"
      >
        <h3 class="text-lg font-bold uppercase tracking-wide text-nomad-deep">Que cartas salieron en esta tirada</h3>
        <p id="manualPickModalHelp" class="mt-2 text-sm text-nomad-deep/85"></p>
        <input
          id="manualPickSearchInput"
          type="text"
          placeholder="Buscar carta..."
          class="mt-3 w-full rounded-md border-2 border-black bg-white px-3 py-2 text-nomad-ink outline-none ring-nomad-sea transition focus:ring-2 focus:ring-nomad-sea"
        />
        <div
          id="manualPickModalGrid"
          class="mt-4 grid max-h-[min(52vh,420px)] grid-cols-3 gap-2 overflow-y-auto pr-1 sm:grid-cols-4 md:grid-cols-5"
        ></div>
        <p id="manualPickModalCount" class="mt-3 text-sm text-nomad-deep/90"></p>
        <div class="mt-4 flex shrink-0 gap-3 border-t-2 border-black/15 pt-4">
          <button
            id="manualPickCancelBtn"
            type="button"
            class="flex-1 rounded-md border-2 border-black bg-transparent px-3 py-2 text-nomad-ink transition hover:bg-nomad-dusk/40"
          >
            Cancelar
          </button>
          <button
            id="manualPickConfirmBtn"
            type="button"
            class="flex-1 rounded-md border-2 border-black bg-nomad-sage px-3 py-2 font-semibold text-white transition hover:bg-nomad-deep"
          >
            Confirmar tirada
          </button>
        </div>
      </div>
    </div>

    <div
      id="cardDetailModal"
      class="fixed inset-0 z-[200] hidden"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div
        id="cardDetailBackdrop"
        class="absolute inset-0 bg-white/65 backdrop-blur-md"
        aria-hidden="true"
      ></div>
      <button
        id="cardDetailCloseBtn"
        type="button"
        aria-label="Cerrar"
        class="absolute right-4 top-4 z-[3] flex h-10 w-10 items-center justify-center rounded-md bg-transparent text-nomad-ink transition hover:bg-black/20 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nomad-deep sm:right-6 sm:top-6"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>
      <div class="relative z-[2] flex h-full w-full items-start justify-center overflow-y-auto px-4 py-10 sm:items-center sm:px-6 sm:py-12">
        <div class="flex w-full max-w-5xl flex-col gap-3 md:flex-row md:items-center md:gap-10 lg:gap-14">
          <div class="flex flex-col gap-2 md:hidden">
            <h2
              data-card-detail-title
              class="min-w-0 font-serif text-2xl font-semibold text-nomad-deep"
            ></h2>
            <p
              data-card-detail-description
              class="min-w-0 whitespace-pre-line text-base leading-relaxed text-nomad-ink/90"
            ></p>
          </div>
          <div class="flex justify-center md:order-1 md:w-[320px] md:flex-shrink-0 md:justify-end">
            <div
              id="cardDetailImageFrame"
              class="relative aspect-[350/600] w-full max-w-[208px] overflow-hidden rounded-md border-2 border-black bg-nomad-paper shadow-[0_3px_0_0_rgba(0,0,0,0.85),0_8px_18px_rgba(51,52,68,0.18)] sm:max-w-[240px] md:max-w-[320px]"
            >
              <img
                id="cardDetailImage"
                src=""
                alt=""
                class="block h-full w-full object-contain object-center"
                decoding="async"
              />
            </div>
          </div>
          <div class="flex min-w-0 flex-col gap-3 md:order-2 md:min-w-0 md:flex-1">
            <h2
              data-card-detail-title
              class="hidden min-w-0 font-serif text-2xl font-semibold text-nomad-deep md:block md:text-3xl"
            ></h2>
            <p
              data-card-detail-description
              class="hidden min-w-0 whitespace-pre-line text-base leading-relaxed text-nomad-ink/90 md:block"
            ></p>
            <textarea
              id="cardDetailNotes"
              rows="5"
              placeholder="Agrega tu interpretación..."
              class="w-full resize-y rounded-md border border-black bg-nomad-cream px-3 py-2 text-base text-nomad-ink"
            ></textarea>
          </div>
        </div>
      </div>
    </div>
    </div>

    <script>
      const IMAGE_BASE_URL = "https://raw.githubusercontent.com/metabismuth/tarot-json/master/cards";
      const ANIMATED_IMAGE_BASE_URL = "https://kamiareo.com/wp-content/uploads/2023/12";
      const TAROT_API_ES_URL = "https://tarot-api-es.vercel.app/api/v1/cards";
      const TAROT_API_EN_FALLBACK_URL = "https://tarotapi.dev/api/v1/cards";
      const TAROT_CARD_BACK_SRC =
        "data:image/svg+xml," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 600">' +
            "<defs>" +
            '<linearGradient id="b" x1="0" y1="0" x2="1" y2="1">' +

      function fitCardPrintedTitleBar(barEl) {
        if (!barEl || !(barEl instanceof HTMLElement)) return;

        if (!(text instanceof HTMLElement)) return;
        const padPx = 10;
        const measureAndApply = () => {
          text.style.removeProperty("transform");
          const bw = barEl.clientWidth - padPx;
          const tw = text.scrollWidth;
          const condensedX = 0.78;
          const stretchY = 1.19;
          if (tw <= 0 || bw <= 0) {
            text.style.transform = `scale(${condensedX}, ${stretchY})`;
            return;
          }
          const sx = Math.min(condensedX, (bw / tw) * 0.995);
          text.style.transform = `scale(${sx.toFixed(5)}, ${stretchY})`;
        };
        requestAnimationFrame(() => {
          measureAndApply();
          requestAnimationFrame(measureAndApply);
        });
      }

      function generateShareCode() {
        let out = "";
        const len = SHARE_CODE_ALPHABET.length;
        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          const buf = new Uint32Array(SHARE_CODE_LENGTH);
          window.crypto.getRandomValues(buf);
          for (let i = 0; i < SHARE_CODE_LENGTH; i += 1) {
            out += SHARE_CODE_ALPHABET[buf[i] % len];
          }
        } else {
          for (let i = 0; i < SHARE_CODE_LENGTH; i += 1) {
            out += SHARE_CODE_ALPHABET[Math.floor(Math.random() * len)];
          }
        }
        return out;

      function removeCardIdentityTerms(text) {
        if (!text) return "";
        let cleaned = String(text);
        const escapedMajors = MAJOR_ARCANA.map((name) => name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
        if (escapedMajors.length > 0) {
          cleaned = cleaned.replace(new RegExp(`\\b(?:${escapedMajors.join("|")})\\b`, "gi"), "");
        }
        cleaned = cleaned
          .replace(
            /\b(?:As|Dos|Tres|Cuatro|Cinco|Seis|Siete|Ocho|Nueve|Diez|Sota|Caballo|Reina|Rey)\s+de\s+(?:Bastos|Copas|Espadas|Oros)\b/gi,

          )
          .replace(/\b(?:As|Dos|Tres|Cuatro|Cinco|Seis|Siete|Ocho|Nueve|Diez|Sota|Caballo|Reina|Rey)\b/gi, "")
          .replace(/\s+/g, " ")
          .replace(/\s+([,.;:!?])/g, "$1")
          .trim();
        return cleaned;
      }

      function ensureTarotMeaningsLoaded() {
        if (meaningsByShort) return Promise.resolve(meaningsByShort);
        if (!meaningsFetchPromise) {
          meaningsFetchPromise = fetch(TAROT_API_ES_URL)
            .then((res) => {
              if (!res.ok) throw new Error("ES API unavailable");
              return res.json();
            })
            .then((payload) => {
              meaningsByShort = fillMeaningsMapFromPayload(payload);
              if (meaningsByShort.size === 0) throw new Error("No Spanish meanings");
              return meaningsByShort;
            })
            .catch(() =>
              fetch(TAROT_API_EN_FALLBACK_URL)
                .then((res) => res.json())
                .then((payload) => {
                  meaningsByShort = fillMeaningsMapFromPayload(payload);
                  return meaningsByShort;
                })
                .catch(() => {
                  meaningsByShort = new Map();
                  return meaningsByShort;
                })
            );
        }
        return meaningsFetchPromise;

      function cardKeywordTripletText(cardId) {
        const fixed = cardId && CARD_KEYWORD_TRIPLETS[cardId];
        if (fixed) return fixed;
        const short = ourCardIdToApiShort(cardId);
        const raw = short && meaningsByShort ? meaningsByShort.get(short) : "";
        const words = String(shortWords(raw, 12))
          .replace(/[,;:]/g, " ")
          .split(/\s+/)
          .filter(Boolean);
        const picked = [];
        for (const w of words) {
          const lw = w.toLowerCase();
          if (picked.some((p) => p.toLowerCase() === lw)) continue;
          picked.push(w);
          if (picked.length >= 3) break;
        }
        while (picked.length < 3) picked.push("Tarot");
        return picked.slice(0, 3).join(" · ");
      }

      function preloadImage(src) {
        const key = String(src || "").trim();
        if (!key) return Promise.resolve();
        const cached = imagePreloadCache.get(key);
        if (cached) return cached;
        const promise = new Promise((resolve) => {
          const img = new Image();
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            resolve();
          };
          img.onload = finish;
          img.onerror = finish;
          img.src = key;
          if (img.complete) finish();
        });
        imagePreloadCache.set(key, promise);
        return promise;
      }

      function preloadCardMedia(cards, options) {
        const waitForAnimated = Boolean(options && options.waitForAnimated);
        const staticSources = new Set();
        const animatedSources = new Set();
        for (const card of cards || []) {
          const staticSrc = String(card?.staticImg || card?.img || "").trim();
          const animatedSrc = String(card?.animatedImg || "").trim();
          if (staticSrc) staticSources.add(staticSrc);
          if (animatedSrc) animatedSources.add(animatedSrc);
        }
        const staticList = [...staticSources];
        const animatedList = [...animatedSources];
        if (waitForAnimated) {
          const allSources = [...new Set([...staticList, ...animatedList])];
          return Promise.all(allSources.map((src) => preloadImage(src))).then(() => undefined);
        }
        return Promise.all(staticList.map((src) => preloadImage(src))).then(() => {
          animatedList.forEach((src) => {
            void preloadImage(src);
          });
        });
      }

      function bindQuantityStepper(inputId, decId, incId) {
        const input = document.getElementById(inputId);
        const dec = document.getElementById(decId);
        const inc = document.getElementById(incId);
        if (!input || !dec || !inc) return;
        const applyStep = (delta) => {
          const max = Math.max(1, Number(input.max) || 999);
          const min = Math.max(1, Number(input.min) || 1);
          let v = parseInt(String(input.value).trim(), 10);
          if (!Number.isFinite(v)) v = min;
          v = clamp(v + delta, min, max);
          input.value = String(v);
        };
        dec.addEventListener("click", () => applyStep(-1));
        inc.addEventListener("click", () => applyStep(1));
      }

      function topReservedAreaBottom(wrapEl) {
        const obstacles = [];
        const search1 = document.getElementById("manualSearchInput");
        if (search1 && search1.offsetParent !== null && !wrapEl.contains(search1)) {
          obstacles.push(search1);
        }
        const search2 = document.getElementById("manualPickSearchInput");
        if (search2 && search2.offsetParent !== null && !wrapEl.contains(search2)) {
          obstacles.push(search2);
        }
        let maxBottom = 0;
        for (const el of obstacles) {

          if (r.bottom > maxBottom) maxBottom = r.bottom;

        return maxBottom;

      function positionCardTooltip(wrapEl, tooltipEl) {

        const margin = 12;
        const gap = 12;
        const vh = window.innerHeight;
        const maxW = Math.min(560, Math.max(300, window.innerWidth - margin * 2));
        const reservedBottom = topReservedAreaBottom(wrapEl);
        const topBoundary = Math.max(margin, reservedBottom + gap);
        tooltipEl.style.maxWidth = `${maxW}px`;
        tooltipEl.style.maxHeight = "none";
        tooltipEl.style.width = "max-content";
        tooltipEl.style.display = "block";
        tooltipEl.style.visibility = "hidden";
        tooltipEl.style.left = `${margin}px`;
        tooltipEl.style.top = "0px";
        const rect = wrapEl.getBoundingClientRect();
        tooltipEl.offsetWidth;
        const tw = tooltipEl.offsetWidth;
        const th = tooltipEl.offsetHeight;
        let top = rect.top - th - gap;
        if (top < topBoundary) {
          top = rect.bottom + gap;
        }
        top = clamp(top, topBoundary, vh - margin - th);
        let left = rect.left + rect.width / 2 - tw / 2;
        left = clamp(left, margin, window.innerWidth - margin - tw);
        tooltipEl.style.visibility = "";
        tooltipEl.style.left = `${left}px`;
        tooltipEl.style.top = `${top}px`;
      }

      function prefersFinePointerHover() {
        return (
          typeof window.matchMedia === "function" &&
          window.matchMedia("(hover: hover) and (pointer: fine)").matches
        );
      }

      /** Texto largo solo para la unica carta de la primera tirada, hasta que exista alguna tirada posterior con mas de una carta. */
      function tableCardTooltipUseFullInsight(roundIndex) {
        if (roundIndex !== 0) return false;
        const r0 = revealedRounds[0];
        if (!r0 || r0.length !== 1) return false;
        for (let i = 1; i < revealedRounds.length; i += 1) {
          if (revealedRounds[i].length > 1) return false;
        }
        return true;
      }

      function attachCardTooltipBehavior(wrap, card, options) {
        const tip = getSharedCardTarotTooltip();
        const tableRound =
          options && typeof options.tableRoundIndex === "number" && Number.isFinite(options.tableRoundIndex)
            ? options.tableRoundIndex
            : null;

        const buildTooltipHtml = () => {
          let useFullInsight;
          if (tableRound != null) {
            useFullInsight = tableCardTooltipUseFullInsight(tableRound);
          } else {
            useFullInsight = !options || options.useFullInsight !== false;
          }
          return `
            <p class="font-semibold text-nomad-deep">${escapeHtml(card.name)}</p>
            <p class="mt-2 border-t-2 border-black/10 pt-2 text-base leading-relaxed text-nomad-ink/90">${escapeHtml(
              cardDescriptionForTooltip(card.id, useFullInsight)
            )}</p>
          `;
        };

        const showTooltip = () => {
          activeCardTooltipWrap = wrap;
          tip.innerHTML = buildTooltipHtml();
          tip.style.opacity = "1";
          positionCardTooltip(wrap, tip);
        };
        const hideTooltip = () => {
          if (activeCardTooltipWrap === wrap) {
            tip.style.opacity = "0";
            tip.style.visibility = "";
            activeCardTooltipWrap = null;
          }
        };

        if (prefersFinePointerHover()) {
          wrap.addEventListener("mouseenter", showTooltip);
          wrap.addEventListener("mouseleave", hideTooltip);
          return;
        }

        wrap.addEventListener("click", (event) => {
          event.stopPropagation();
          if (activeCardTooltipWrap === wrap && tip.style.opacity === "1") {
            hideTooltip();
            return;
          }
          showTooltip();
        });
      }

      function hideActiveCardTooltip() {
        const tip = sharedCardTarotTooltip;
        if (!tip || tip.style.opacity !== "1") return;
        tip.style.opacity = "0";
        tip.style.visibility = "";
        activeCardTooltipWrap = null;
      }

      function hoverFrontTransform(baseTransform) {
        const base = String(baseTransform || "").trim();
        if (!base) return "scale(1.1) rotate(0deg)";
        const withScale = /scale\([^)]*\)/.test(base)
          ? base.replace(/scale\([^)]*\)/, "scale(1.13)")
          : `${base} scale(1.13)`;
        return /rotate\([^)]*\)/.test(withScale)
          ? withScale.replace(/rotate\([^)]*\)/, "rotate(0deg)")
          : `${withScale} rotate(0deg)`;
      }

      function addTableCardElevated(el) {
        for (const c of TABLE_CARD_ELEVATED_CLASSES) el.classList.add(c);
      }
      function removeTableCardElevated(el) {
        for (const c of TABLE_CARD_ELEVATED_CLASSES) el.classList.remove(c);
      }

      function attachCardHoverFrontBehavior(wrap) {
        let baseTransform = "";
        const elevate = () => {
          if (!baseTransform) {
            baseTransform = wrap.dataset.baseTransform || wrap.style.transform || "";
          }
          if (activeFrontCardWrap && activeFrontCardWrap !== wrap) {
            removeTableCardElevated(activeFrontCardWrap);
            activeFrontCardWrap.style.transform =
              activeFrontCardWrap.dataset.baseTransform || activeFrontCardWrap.style.transform;
          }
          activeFrontCardWrap = wrap;
          addTableCardElevated(wrap);
          wrap.style.transform = hoverFrontTransform(baseTransform);
        };
        const restore = () => {
          removeTableCardElevated(wrap);
          wrap.style.transform = baseTransform || wrap.dataset.baseTransform || wrap.style.transform;
          if (activeFrontCardWrap === wrap) {
            activeFrontCardWrap = null;
          }
        };
        if (prefersFinePointerHover()) {
          wrap.addEventListener("mouseenter", elevate);
          wrap.addEventListener("mouseleave", restore);
          return;
        }
        wrap.addEventListener("click", () => {
          if (activeFrontCardWrap === wrap) {
            restore();
            return;
          }
          elevate();
        });
      }

      function attachCardAnimatedPreviewBehavior(hoverTarget, imgEl, card) {
        if (!imgEl || !card || !card.animatedImg) return;
        const staticSrc = card.staticImg || card.img;
        let restoring = false;
        imgEl.src = staticSrc;
        imgEl.addEventListener("error", () => {
          imgEl.src = staticSrc;
        });

        const playAnimated = () => {
          if (restoring) return;
          restoring = true;
          imgEl.src = staticSrc;
          requestAnimationFrame(() => {
            imgEl.src = card.animatedImg;
            restoring = false;
          });
        };

        const stopAnimated = () => {
          restoring = false;
          imgEl.src = staticSrc;
        };

        hoverTarget.addEventListener("mouseenter", playAnimated);
        hoverTarget.addEventListener("mouseleave", stopAnimated);
        hoverTarget.addEventListener("focusin", playAnimated);
        hoverTarget.addEventListener("focusout", stopAnimated);
      }

      const cardNotes = new Map();
      let activeCardDetailCardId = null;
      let cardDetailLastFocusedEl = null;
      let persistCardNotesTimer = 0;

      function serializeCardNotes() {
        const obj = {};
        for (const [id, val] of cardNotes.entries()) {
          const v = String(val == null ? "" : val);
          if (v.length > 0) obj[id] = v;
        }
        if (Object.keys(obj).length === 0) return "";
        try {
          return encodeURIComponent(JSON.stringify(obj));
        } catch (_) {
          return "";
        }
      }

      function parseCardNotesEncoded(encoded) {
        const map = new Map();
        if (!encoded) return map;
        let parsed;
        try {
          parsed = JSON.parse(decodeURIComponent(encoded));
        } catch (_) {
          return map;
        }
        if (!parsed || typeof parsed !== "object") return map;
        for (const [k, v] of Object.entries(parsed)) {
          if (typeof k === "string" && typeof v === "string" && v.length > 0) {
            map.set(k, v);
          }
        }
        return map;
      }

      function persistCardNotes() {
        if (persistCardNotesTimer) {
          window.clearTimeout(persistCardNotesTimer);
          persistCardNotesTimer = 0;
        }
        const encoded = serializeCardNotes();
        try {
          const url = new URL(window.location.href);
          if (url.searchParams.has(NOTES_URL_PARAM)) {
            url.searchParams.delete(NOTES_URL_PARAM);
            window.history.replaceState(null, "", url.toString());
          }
        } catch (_) {}
        try {
          if (encoded) {
            window.localStorage.setItem(NOTES_STORAGE_KEY, encoded);
          } else {
            window.localStorage.removeItem(NOTES_STORAGE_KEY);
          }
        } catch (_) {}
      }

      function persistCardNotesDebounced() {
        if (persistCardNotesTimer) window.clearTimeout(persistCardNotesTimer);
        persistCardNotesTimer = window.setTimeout(() => {
          persistCardNotesTimer = 0;
          persistCardNotes();
        }, 250);
      }

      function readCardNotesFromUrlOrStorage() {
        let encoded = "";
        let cameFromUrl = false;
        try {
          encoded = new URL(window.location.href).searchParams.get(NOTES_URL_PARAM) || "";
          if (encoded) cameFromUrl = true;
        } catch (_) {
          encoded = "";
        }
        if (!encoded) {
          try {
            encoded = window.localStorage.getItem(NOTES_STORAGE_KEY) || "";
          } catch (_) {
            encoded = "";
          }
        }
        if (cameFromUrl) {
          try {
            const url = new URL(window.location.href);
            url.searchParams.delete(NOTES_URL_PARAM);
            window.history.replaceState(null, "", url.toString());
          } catch (_) {}
          if (encoded) {
            try {
              window.localStorage.setItem(NOTES_STORAGE_KEY, encoded);
            } catch (_) {}
          }
        }
        if (!encoded) return;
        const parsed = parseCardNotesEncoded(encoded);
        for (const [id, val] of parsed.entries()) {
          cardNotes.set(id, val);
        }
      }

      function clearActiveTableCardElevation() {
        if (!activeFrontCardWrap) return;
        removeTableCardElevated(activeFrontCardWrap);
        activeFrontCardWrap.style.transform =

      function openCardDetailModal(card, options) {
        if (!card) return;
        if (activeCardDetailCardId && activeCardDetailCardId !== card.id) {
          cardNotes.set(activeCardDetailCardId, cardDetailNotes.value);

        cardDetailImage.src = animatedSrc;
        cardDetailImage.alt = card.name || "";
        cardDetailImage.className =

        applyCardDetailPrintedTitle(card);
        const titleText = card.name || "";
        cardDetailTitleEls.forEach((el) => {
          el.textContent = titleText;
        });
        const tableRoundIndex =
          options && Number.isFinite(options.tableRoundIndex) ? options.tableRoundIndex : null;
        const useFullInsight =
          tableRoundIndex != null
            ? tableCardTooltipUseFullInsight(tableRoundIndex)
            : true;
        const descriptionText = cardDescriptionForTooltip(card.id, useFullInsight) || "";
        cardDetailDescriptionEls.forEach((el) => {
          el.textContent = descriptionText;
        });
        cardDetailNotes.value = cardNotes.get(card.id) || "";
        hideActiveCardTooltip();
        clearActiveTableCardElevation();
        cardDetailLastFocusedEl =

        cardDetailModal.classList.remove("hidden");

      function closeCardDetailModal() {
        if (cardDetailModal.classList.contains("hidden")) return;
        if (activeCardDetailCardId) {
          cardNotes.set(activeCardDetailCardId, cardDetailNotes.value);

        activeCardDetailCardId = null;
        persistCardNotes();
        cardDetailModal.classList.add("hidden");
        cardDetailModal.setAttribute("aria-hidden", "true");
        cardDetailImage.removeAttribute("src");
        cardDetailImage.className = CARD_DETAIL_IMAGE_BASE_CLASS;
        clearCardDetailPrintedTitle();
        document.body.classList.remove("overflow-hidden");
        if (cardDetailLastFocusedEl && typeof cardDetailLastFocusedEl.focus === "function") {

      function attachTableCardDetailBehavior(wrap, card, options) {
        wrap.style.cursor = "pointer";
        wrap.addEventListener("click", (event) => {

      function buildManualCardThumbLabel(card) {
